name: skillpath-ai

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        init: true
        restart: unless-stopped
        ports:
            - '8080:8080'
            - '5173:5173'
        environment:
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_STARTUP_MAX_ATTEMPTS: '30'
            DB_STARTUP_RETRY_DELAY: '2'
            DB_MIGRATION_MAX_ATTEMPTS: '10'
            DB_MIGRATION_RETRY_DELAY: '3'
            MONGODB_URI: mongodb://mongodb:27017
            MONGODB_DATABASE: ${MONGODB_DATABASE:-skillpathai_auth}
            AUTH_CREDENTIAL_STORE: ${AUTH_CREDENTIAL_STORE:-postgres}
            PHP_CLI_SERVER_WORKERS: '8'
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            postgres:
                condition: service_healthy
                restart: true
            mongodb:
                condition: service_healthy
                restart: true
        healthcheck:
            test:
                - CMD-SHELL
                - 'php -r ''exit(@fsockopen("127.0.0.1", 8080) ? 0 : 1);'''
            interval: 10s
            timeout: 3s
            retries: 6
            start_period: 30s

    postgres:
        image: postgres:18
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    mongodb:
        image: mongo:8.0
        restart: unless-stopped
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test:
                - CMD
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
        external: true
        name: skillpath-ai-postgres-persistent

    mongodb_data:

    vendor_data:

    node_modules_data:
