name: skillpath-ai

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        init: true
        restart: unless-stopped
        ports:
            - '8080:8080'
            - '5173:5173'
        environment:
            DB_HOST: postgres
            PHP_CLI_SERVER_WORKERS: '8'
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:18
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
        external: true
        name: skillpath-ai-postgres-persistent

    vendor_data:

    node_modules_data:
