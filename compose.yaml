name: skillpath-ai

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        init: true
        restart: unless-stopped
        ports:
            - '8080:8080'
            - '5173:5173'
        env_file:
            - .env
        environment:
            APP_URL: http://localhost:8080
            DB_HOST: postgres
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    php -r '$$ch=curl_init("http://127.0.0.1:8080");
                    curl_setopt($$ch,CURLOPT_NOBODY,true);
                    curl_setopt($$ch,CURLOPT_RETURNTRANSFER,true);
                    curl_setopt($$ch,CURLOPT_TIMEOUT,3);
                    curl_exec($$ch);
                    $$code=curl_getinfo($$ch,CURLINFO_HTTP_CODE);
                    curl_close($$ch);
                    exit($$code >= 200 && $$code < 500 ? 0 : 1);'
                    &&
                    php -r '$$ch=curl_init("http://127.0.0.1:5173/@vite/client");
                    curl_setopt($$ch,CURLOPT_NOBODY,true);
                    curl_setopt($$ch,CURLOPT_RETURNTRANSFER,true);
                    curl_setopt($$ch,CURLOPT_TIMEOUT,3);
                    curl_exec($$ch);
                    $$code=curl_getinfo($$ch,CURLINFO_HTTP_CODE);
                    curl_close($$ch);
                    exit($$code >= 200 && $$code < 400 ? 0 : 1);'
            interval: 3s
            timeout: 10s
            retries: 40
            start_period: 20s

    postgres:
        image: postgres:18
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
        external: true
        name: skillpath-ai-postgres-persistent

    vendor_data:

    node_modules_data:
