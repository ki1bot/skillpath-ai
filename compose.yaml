name: skillpath-ai

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            target: development
        init: true
        restart: unless-stopped
        ports:
            - '8000:8000'
            - '5173:5173'
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: '5432'
            DB_DATABASE: skillpathai
            DB_USERNAME: root
            DB_PASSWORD: 023560R
            RUN_SEEDER: 'true'
            RUN_ASSESSMENT_SEEDER: 'false'
        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor
            - node_modules_data:/var/www/html/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                - CMD-SHELL
                - >-
                    php -r '$$ch=curl_init("http://127.0.0.1:8000");
                    curl_setopt($$ch,CURLOPT_NOBODY,true);
                    curl_setopt($$ch,CURLOPT_RETURNTRANSFER,true);
                    curl_exec($$ch);
                    $$code=curl_getinfo($$ch,CURLINFO_HTTP_CODE);
                    exit($$code >= 200 && $$code < 500 ? 0 : 1);'
            interval: 3s
            timeout: 5s
            retries: 20
            start_period: 15s

    postgres:
        image: postgres:18
        restart: unless-stopped
        ports:
            - '5433:5432'
        environment:
            POSTGRES_DB: skillpathai
            POSTGRES_USER: root
            POSTGRES_PASSWORD: 023560R
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -U root -d skillpathai
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    postgres_data:
    vendor_data:
    node_modules_data:
